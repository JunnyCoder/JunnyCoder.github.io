<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<script src="../js/shared/editor-ui.js"></script>
<title>Markdown 에디터</title>
<link rel="shortcut icon" type="image/png" href="../assets/img/favicon_main.png">


<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="../js/shared/markdown-options.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="../js/shared/code-blocks.js"></script>
<script src="../js/pdf-maker/templates.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<!-- KaTeX 스타일시트 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<!-- KaTeX 코어 JS -->
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<!-- KaTeX Auto-render 확장 스크립트 (수식 기호 자동 감지용) -->
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>


<link rel="stylesheet" href="../css/markdown-editor/style.css">
<link rel="stylesheet" href="../css/shared/code-blocks.css" data-code-block-style>
<link rel="stylesheet" href="../css/shared/element-designs.css" data-element-style>
<link rel="stylesheet" href="../css/shared/editor-ui.css">
</head>
<body>
<div id="app">

  <header class="toolbar">
    <div class="toolbar-left">
      <span class="toolbar-label">보기</span>
      <div class="segmented" id="viewSegment">
        <button type="button" class="seg-btn active" data-mode="split">분할</button>
        <button type="button" class="seg-btn" data-mode="editor">편집기</button>
        <button type="button" class="seg-btn" data-mode="preview">미리보기</button>
      </div>
      <span class="toolbar-label">스크롤</span>
      <div class="segmented" id="scrollSegment" aria-label="스크롤 방식">
        <button type="button" class="seg-btn active" data-sync="on" aria-pressed="true" title="편집기와 미리보기를 함께 스크롤">동기화</button>
        <button type="button" class="seg-btn" data-sync="off" aria-pressed="false" title="입력할 때만 미리보기가 따라옴">분리</button>
      </div>
    </div>
    <div class="toolbar-center">
      <button type="button" class="btn-pill btn-accent" id="sendToPdfBtn">PDF 편집</button>
      <button type="button" class="btn-pill" id="downloadMdBtn">.md</button>
      <button type="button" class="btn-pill" id="downloadHtmlBtn">.html</button>
    </div>
    <div class="toolbar-right">
      <button type="button" class="btn-ghost theme-toggle" id="uiThemeToggle" aria-label="라이트 모드로 전환" aria-pressed="false" title="라이트 모드로 전환"><span aria-hidden="true" data-theme-icon>☾</span><span data-theme-label>다크</span></button>
      <div class="shortcut-help">
        <button type="button" class="btn-text shortcut-help-button" aria-describedby="shortcutTooltip">단축키 ?</button>
        <div class="shortcut-popover" id="shortcutTooltip" role="tooltip">
          <div class="shortcut-popover-title">단축키</div>
          <div class="shortcut-list" id="shortcutList"></div>
        </div>
      </div>
      <button type="button" class="btn-text" id="tempSaveBtn">임시저장</button>
      <button type="button" class="btn-text" id="historyBtn">히스토리</button>
      <button type="button" class="btn-text" id="loadExampleBtn">예제 불러오기</button>
      <button type="button" class="btn-text" id="clearBtn">지우기</button>
    </div>
  </header>

  <main class="workspace" id="workspace">
    <section class="pane pane-editor" id="paneEditor">
      <div class="pane-header">
        <span class="pane-title">MARKDOWN</span>
        <span class="pane-stats" id="statsLabel">0줄 · 0B</span>
      </div>
      <div class="pane-body" id="editorHost"></div>
    </section>

    <div class="divider" id="divider">
      <div class="divider-grip"></div>
    </div>

    <section class="pane pane-preview" id="panePreview">
      <div class="pane-header">
        <span class="pane-title">미리보기</span>
        <button type="button" class="btn-ghost" id="copyHtmlBtn">HTML 복사</button>
      </div>
      <div class="pane-body">
        <div class="preview-body" id="previewHost"></div>
      </div>
    </section>
  </main>

</div>

<div class="modal-overlay" id="historyOverlay" hidden>
  <div class="modal-panel">
    <div class="modal-header">
      <span>히스토리</span>
      <button type="button" class="modal-close" id="historyCloseBtn" aria-label="닫기">&times;</button>
    </div>
    <div class="modal-body" id="historyList"></div>
    <div class="modal-footer">
      <span class="modal-hint">브라우저에 자동 저장된 이전 버전입니다.</span>
      <button type="button" class="btn-ghost" id="historyClearBtn">전체 삭제</button>
    </div>
  </div>
</div>

<script src="../js/markdown-editor/script.js"></script>
</body>
</html>
